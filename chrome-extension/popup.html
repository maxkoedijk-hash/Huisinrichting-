<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #222;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #da291c;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 21px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 21px;
      transition: background 0.15s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 17px;
      height: 17px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }
    input:checked + .slider {
      background: #da291c;
    }
    input:checked + .slider::before {
      transform: translateX(17px);
    }
    button {
      width: 100%;
      padding: 6px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #eee;
    }
    #status {
      margin-top: 8px;
      min-height: 14px;
      font-size: 11px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Postcode naar McDonald's</h1>
  <div class="row">
    <span>Extensie ingeschakeld</span>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </div>
  <button id="clear-cache">Cache wissen</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
